# Central place for every dependency version used by the build.
# See https://docs.gradle.org/current/userguide/version_catalogs.html

[versions]
agp = "9.4.1"
androidx-core = "1.19.0"
androidx-cursoradapter = "1.0.0"
androidx-fragment = "1.9.0"
androidx-loader = "1.2.0"

[libraries]
androidx-core = { module = "androidx.core:core", version.ref = "androidx-core" }
androidx-cursoradapter = { module = "androidx.cursoradapter:cursoradapter", version.ref = "androidx-cursoradapter" }
androidx-fragment = { module = "androidx.fragment:fragment", version.ref = "androidx-fragment" }
androidx-loader = { module = "androidx.loader:loader", version.ref = "androidx-loader" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
