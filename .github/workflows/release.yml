name: Release

# Publishes a draft GitHub release with a signed APK (for sideloading) and an Android App Bundle
# (for uploading to Google Play). Tag a release to run it; see cicd_notes.md.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Name for the release (defaults to the current ref)'
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Check the signing lineage
        run: bash signing/sign-apk.sh check-lineage

      - name: Decode the keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No KEYSTORE_BASE64 secret; the release will be unsigned."
            exit 0
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.p12"
          echo "path=$RUNNER_TEMP/release.p12" >> "$GITHUB_OUTPUT"

      # Gradle signs the bundle with the current key, which is also the Google Play upload key.
      - name: Build the bundle
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      # Built without a key, so it can be signed with the lineage below.
      - name: Build the APK
        run: ./gradlew assembleRelease

      - name: Sign the APK
        if: steps.keystore.outputs.path != ''
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          bash signing/sign-apk.sh sign \
            app/build/outputs/apk/release/app-release-unsigned.apk signed/app-release.apk

      - name: Collect the artifacts
        id: collect
        run: |
          tag="${{ inputs.tag }}"
          [ -n "$tag" ] || tag="${GITHUB_REF_NAME}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          version=$(sed -n 's/.*versionName *= *"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          mkdir -p artifacts

          # The lineage-signed APK if there is one, otherwise what Gradle built.
          apk="signed/app-release.apk"
          [ -e "$apk" ] || apk=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$apk" "artifacts/units-$version.apk"
          cp app/build/outputs/bundle/release/*.aab "artifacts/units-$version.aab"

          ls -l artifacts

      - name: Verify the signature
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner"

          {
            echo "### APK signature"
            echo
            echo "| File | Signer certificate (SHA-256) |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          for apk in artifacts/*.apk; do
            if report="$("$apksigner" verify --min-sdk-version 28 --print-certs "$apk" 2>&1)"; then
              digest="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' <<<"$report")"
              echo "| $(basename "$apk") | \`$digest\` |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::$(basename "$apk") is not signed; set the signing secrets to get an installable build."
              echo "| $(basename "$apk") | **not signed** |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.collect.outputs.tag }}" \
            --title "${{ steps.collect.outputs.tag }}" \
            --generate-notes \
            --draft \
            artifacts/*
          echo "Draft release created; review and publish it on the Releases page." >> "$GITHUB_STEP_SUMMARY"
